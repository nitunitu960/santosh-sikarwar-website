# ============================================================
# प्रबंधन पैनल कॉन्फ़िगरेशन / Admin Panel Configuration
# ============================================================
# नीचे YOUR-USERNAME को अपने GitHub यूज़रनेम से बदलें।
# base_url को अपने OAuth (लॉगिन) सर्वर के पते से बदलें।
# विवरण के लिए CMS-SETUP.md पढ़ें।
# ============================================================

backend:
  name: github
  repo: nitunitu960/santosh-sikarwar-website
  branch: main
  base_url: https://dark-cell-cca5santosh-cms-login.nitins3051.workers.dev

# फ़ोटो कहाँ सेव हों
media_folder: "images"
public_folder: "/images"

# पैनल की भाषा
locale: "hi"

collections:
  # ---------- समाचार / गतिविधियाँ ----------
  - name: "feed"
    label: "समाचार / गतिविधियाँ"
    files:
      - name: "feed"
        label: "समाचार सूची"
        file: "data/feed.json"
        fields:
          - label: "समाचार / गतिविधि"
            name: "posts"
            widget: "list"
            label_singular: "समाचार / गतिविधि"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "शीर्षक", name: "title", widget: "string", hint: "गतिविधि/कार्यक्रम का वास्तविक शीर्षक" }
              - { label: "तारीख", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "कार्यक्रम की वास्तविक तिथि" }
              - { label: "स्थान", name: "location", widget: "string", required: false, hint: "जैसे: आगरा, उत्तर प्रदेश (यदि लागू हो)" }
              - label: "श्रेणी"
                name: "category"
                widget: "select"
                required: false
                default: "अन्य"
                options: ["कार्यक्रम", "जनसंपर्क", "संगठनात्मक गतिविधि", "सामाजिक गतिविधि", "बैठक", "सम्मान", "अन्य"]
              - { label: "मुख्य फ़ोटो", name: "image", widget: "image", required: false, hint: "featured image" }
              - { label: "संक्षिप्त विवरण (excerpt)", name: "excerpt", widget: "text", required: false, hint: "कार्ड पर दिखने वाला 1-2 पंक्ति का सार" }
              - { label: "पूरा विवरण", name: "text", widget: "text", hint: "गतिविधि का पूरा विवरण" }
              - label: "गैलरी फ़ोटो (वैकल्पिक)"
                name: "gallery"
                widget: "list"
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: "फ़ोटो", name: "src", widget: "image" }
                  - { label: "कैप्शन", name: "caption", widget: "string", required: false }
              - { label: "लेखक/स्रोत", name: "author", widget: "string", required: false, default: "संतोष सिकरवार" }
              - { label: "मुख्य (featured) बनाएँ?", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "प्रकाशित करें?", name: "published", widget: "boolean", default: true, hint: "बंद रखने पर वेबसाइट पर नहीं दिखेगा" }
              - { label: "अद्यतन तिथि (यदि बदला हो)", name: "updated_at", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }

  # ---------- फोटो गैलरी ----------
  - name: "gallery"
    label: "फोटो गैलरी"
    files:
      - name: "gallery"
        label: "गैलरी फ़ोटो"
        file: "data/gallery.json"
        fields:
          - label: "फ़ोटो"
            name: "photos"
            widget: "list"
            label_singular: "फ़ोटो"
            summary: "{{fields.caption}}"
            fields:
              - { label: "फ़ोटो", name: "src", widget: "image" }
              - { label: "शीर्षक", name: "caption", widget: "string", required: false }

  # ---------- प्रोफ़ाइल / संपर्क सेटिंग ----------
  - name: "settings"
    label: "प्रोफ़ाइल एवं संपर्क"
    files:
      - name: "profile"
        label: "प्रोफ़ाइल जानकारी"
        file: "data/settings.json"
        fields:
          - { label: "नाम", name: "name", widget: "string" }
          - { label: "पद", name: "role", widget: "string" }
          - { label: "नारा", name: "slogan", widget: "string" }
          - { label: "मुख्य फ़ोटो", name: "photo", widget: "image", required: false }
          - { label: "हेडर लोगो / कमल प्रतीक", name: "logo", widget: "image", required: false, hint: "हेडर में नाम के साथ दिखने वाला लोगो। खाली = डिफ़ॉल्ट कमल" }
          - { label: "ब्राउज़र टैब आइकन (favicon)", name: "favicon", widget: "image", required: false, hint: "ब्राउज़र टैब में दिखने वाला छोटा आइकन (चौकोर PNG अनुशंसित)। खाली = हेडर लोगो" }
          - { label: "राजनीतिक यात्रा टाइमलाइन आइकन", name: "timeline_icon", widget: "image", required: false, hint: "टाइमलाइन पर दिखने वाला छोटा आइकन। खाली = डिफ़ॉल्ट कमल" }
          - { label: "पार्टी लोगो (फ़ुटर)", name: "party_logo", widget: "image", required: false, hint: "खाली छोड़ने पर डिफ़ॉल्ट BJP लोगो दिखेगा" }
          - { label: "बैनर फ़ोटो (चौड़ी)", name: "banner", widget: "image", required: false }
          - { label: "बैनर पर लिखा वाक्य", name: "bannerCaption", widget: "string", required: false }
          - { label: "ई-मेल", name: "email", widget: "string", required: false }
          - { label: "फ़ोन", name: "phone", widget: "string", required: false }
          - { label: "क्षेत्र", name: "area", widget: "string", required: false }
          - { label: "Facebook लिंक", name: "facebook", widget: "string", required: false }
          - { label: "Instagram लिंक", name: "instagram", widget: "string", required: false }
          - { label: "X (Twitter) लिंक", name: "twitter", widget: "string", required: false }
