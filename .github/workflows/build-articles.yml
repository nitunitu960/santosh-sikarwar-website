name: Build article pages

# Whenever the content (data/feed.json etc.) or the templates change on main,
# regenerate the pre-rendered static article pages under /samachar/<slug>/ and
# the sitemaps, then commit them back. This keeps the crawlable HTML in sync
# with what is published through the Decap CMS admin panel — no manual step.
#
# GitHub Pages itself cannot run this Python at request time, so we bake the
# pages at commit time here and Pages simply serves the resulting static files.

on:
  push:
    branches: [ main ]
    paths:
      - "data/**"
      - "build_articles.py"
      - "generate_sitemaps.py"
      - "samachar/article.js"
      - ".github/workflows/build-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-articles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pre-render static article pages
        run: python build_articles.py

      - name: Regenerate sitemaps
        run: python generate_sitemaps.py

      - name: Validate sitemap XML
        run: |
          python -c "import xml.dom.minidom as m;[m.parse(f) for f in ['sitemap.xml','image-sitemap.xml','news-sitemap.xml']];print('XML OK')"

      - name: Commit & push only if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild article pages + sitemaps [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
