name: Facebook Page import

# Runs the server-side importer on a schedule (GitHub Pages itself CANNOT run
# server code). Facebook post -> this Action -> feed.json + sitemaps -> push
# -> GitHub Pages deploys. There is a delay (up to the schedule interval + build).

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: facebook-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Import new Facebook Page posts
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python import_facebook.py

      - name: Regenerate sitemaps
        run: python generate_sitemaps.py

      - name: Validate sitemap XML
        run: |
          python -c "import xml.dom.minidom as m;[m.parse(f) for f in ['sitemap.xml','image-sitemap.xml','news-sitemap.xml']];print('XML OK')"

      - name: Commit & push only if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-import Facebook Page posts + regenerate sitemaps [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
