name: Build Static Articles & Sitemaps

on:
  push:
    paths:
      - 'data/feed.json'
      - 'data/settings.json'
      - 'build_static_pages.py'
      - 'generate_sitemaps.py'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run static builder
        run: python build_static_pages.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate static articles and sitemaps [skip ci]" && git push)
